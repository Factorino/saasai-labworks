# Лингвистические переменные нечёткой нормализации ответов.
#
# Не зависят от языка: слова, которые ведут к термам, лежат в
# locales/<язык>/fuzzy.yaml. universe — границы универсума, terms — термы по
# возрастанию значения и трапеции [a, b, c, d]: степень растёт на [a, b],
# равна 1 на [b, c] и убывает на [c, d]; при b = c трапеция треугольная.
#
# Чёткое значение — центр тяжести. Длительность записывается по нижней целой
# границе в неделях; частота и влияние — термом с наибольшей степенью, при
# равенстве меньшим, поэтому их термы совпадают с кодами шкал онтологии
# (frequency и impactDegree, 0–3). Параметры согласованы с порогами правил
# (длительность ≥ 2 недель, частота ≥ 2, влияние ≥ 1, ≥ 2 и 3) и могут
# подбираться в эксперименте E7.

# Недели.
duration:
  universe: [0, 52]
  terms:
    recently: [0, 0, 1, 2]
    # Центр тяжести 2,5 недели даёт 2 недели — порог правил.
    few_weeks: [1, 2, 3, 4]
    about_month: [3, 4, 5, 7]
    long_time: [6, 10, 26, 52]

# Дней в неделю.
frequency:
  universe: [0, 7]
  terms:
    rarely: [0, 0, 1, 2]
    several_times_a_week: [1, 2, 3, 4]
    most_days: [3, 4, 5, 6]
    constantly: [5, 6, 7, 7]

# Баллы. Трапеции с полкой ±0,25 вокруг целых: у треугольника центр тяжести
# не попадает в вершину, и даже однозначное выражение получало бы низкую
# уверенность.
impact:
  universe: [0, 3]
  terms:
    none: [0, 0, 0.25, 0.75]
    mild: [0.25, 0.75, 1.25, 1.75]
    moderate: [1.25, 1.75, 2.25, 2.75]
    severe: [2.25, 2.75, 3, 3]
