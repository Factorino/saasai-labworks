# Сколько практик показывать в сводке на каждом уровне срочности.
#
# Чем выше уровень, тем меньше самопомощи: основным советом становится
# обращение к специалисту. На L3 практики не показываются вовсе, поэтому
# его здесь нет. insufficient_data — уровень не определён.
#
# limit — сколько практик показать; excluded — практики, которые на этом
# уровне лучше выполнять вместе со специалистом.

L0:
  limit: 5
L1:
  limit: 4
L2:
  limit: 3
  excluded: [GradualExposure_, ThoughtRecord_]
insufficient_data:
  limit: 3
