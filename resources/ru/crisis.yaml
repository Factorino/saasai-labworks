# Шаблоны кризисного детектора на русском языке.
#
# Ключ — категория находки (CrisisCategory), значение — шаблоны (синтаксис — в
# language.yaml). Основы у разных форм глагола часто разные («хочу», «хочет»),
# поэтому формы перечисляются отдельными шаблонами. Пропуск опаснее ложного
# срабатывания: при сомнении шаблон лучше добавить.

# Отрицание перед находкой отменяет её: «никогда не хотел умереть». Шаблон, который
# сам начинается с отрицания («не хочу жить»), не отменяется.
negations: [не, нет, никогда, ни]
negation_window: 3

# Ближайшее действующее лицо перед находкой решает, о ком речь.
first_person: [я, мне, меня, мной, сам, сама]
others:
  - подруга
  - друг
  - знакомый
  - знакомая
  - мама
  - мать
  - папа
  - отец
  - брат
  - сестра
  - сын
  - дочь
  - муж
  - жена
  - парень
  - девушка
  - ребенок
  - коллега
  - сосед
  - соседка
  - он
  - она
  - они
# Слова с той же основой, что у людей из списка выше, но не о людях.
not_others:
  - другой
  - другая
  - другое
  - другие
  - другого
  - другую
  - другому
  - другим
  - другими
  - других
  - другом
  - брать

