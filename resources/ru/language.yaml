# Общее для русского языка: как слова приводятся к сравнимому виду и как читаются
# шаблоны в остальных файлах ресурсов.
#
# Шаблон — слова через пробел. Слова сравниваются по основам (стеммер Snowball),
# поэтому форма слова в тексте может отличаться от шаблона. `...` разрешает
# пропустить до `max_gap` слов между соседними словами шаблона, но не границу
# предложения. Отрицание из раздела `negations` файла в `negation_window` словах
# перед находкой (до границы части предложения) отменяет её, если шаблон сам не
# начинается с отрицания. Из вложенных находок с одним ключом остаётся самая длинная.

stemmer: russian

# Замена букв перед сравнением: «ё» и «е» не различаются.
letters:
  ё: е

max_gap: 3
