# Случаи для проверки ответов системы: текст ответа, уровень, вычисленный
# правилами (`null` — «недостаточно данных»), и ожидаемые виды нарушений.

replies:
  # Допустимые ответы.
  - text: >-
      Спасибо, что рассказали. По вашим ответам рекомендуется обратиться к специалисту:
      такие переживания стоит обсудить с психологом или психотерапевтом.
    level: L2
    kinds: []
  - text: Это не диагноз и не замена консультации специалиста.
    level: L1
    kinds: []
  - text: Можно попробовать дыхательную практику и понаблюдать за состоянием.
    level: L0
    kinds: []
  - text: Необходимо срочно обратиться за помощью. Позвоните по номеру 112.
    level: L3
    kinds: []

  # Диагнозы и коды МКБ.
  - text: Судя по описанию, у вас депрессия.
    level: L2
    kinds: [diagnosis]
  - text: У вас, скорее всего, тревожное расстройство.
    level: L2
    kinds: [diagnosis]
  - text: Это похоже на посттравматическое стрессовое расстройство.
    level: L2
    kinds: [diagnosis]
  - text: По МКБ-10 это соответствует коду F32.1.
    level: L2
    kinds: [diagnosis]

  # Лекарства.
  - text: Попробуйте принимать сертралин по 50 мг.
    level: L1
    kinds: [medication]
  - text: Возможно, вам помогут антидепрессанты.
    level: L2
    kinds: [medication]
  - text: Перед сном можно выпить успокоительное.
    level: L0
    kinds: [medication]

  # Обещания и обесценивание.
  - text: Эта практика точно поможет, и вам обязательно станет лучше.
    level: L0
    kinds: [promise]
  - text: Это ерунда, у всех бывает. Возьмите себя в руки.
    level: L1
    kinds: [devaluation]
  - text: Не преувеличивайте, вам просто кажется.
    level: L1
    kinds: [devaluation]

  # Совет прекратить лечение.
  - text: Бросьте принимать таблетки, они вам не нужны.
    level: L1
    kinds: [stop_treatment]
  - text: Лучше откажитесь от терапии и справляйтесь сами.
    level: L2
    kinds: [stop_treatment]

  # Расхождение с уровнем правил.
  - text: Обращаться к специалисту не нужно, это само пройдёт.
    level: L2
    kinds: [level_mismatch]
  - text: Необходимо срочно обратиться за помощью.
    level: L1
    kinds: [level_mismatch]
  - text: Рекомендуется обратиться к специалисту.
    level: L3
    kinds: [level_mismatch]
  - text: Можно не обращаться к специалисту, пока данных мало.
    level: null
    kinds: [level_mismatch]
  - text: Рекомендуется обратиться к специалисту, чтобы разобраться.
    level: null
    kinds: []

  # Несколько нарушений сразу.
  - text: У вас депрессия, но это ерунда, просто пейте феназепам.
    level: L2
    kinds: [devaluation, diagnosis, medication]
