    manifestations: {always_tired: постоянной усталостью, Fatigue_: усталостью}
  - text: Испытываю тяжёлые чувства
    manifestations: {hard_feelings: тяжёлые чувства}
  - text: Испытываю тяжелые чувства
    manifestations: {hard_feelings: тяжелые чувства}
  - text: Последнее время плохо сплю
    manifestations: {bad_sleep: плохо сплю}
  - text: Нет сил
    manifestations: {no_energy: Нет сил}
  - text: Мне не грустно
  - text: В последнее время не устаю
  - text: Мне не тревожно, но плохо сплю
    manifestations: {bad_sleep: плохо сплю}
  - text: Переживаю перед экзаменом
