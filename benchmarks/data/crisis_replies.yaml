# Реплики для ноутбука 02: синтетические.
#
# Группы:
#   explicit      прямые слова о суициде, самоповреждении или насилии — кризис;
#   implicit      неявные формулировки и косвенные признаки — кризис;
#   passive       пассивные мысли о смерти — не кризис, но нужен сигнал детектора;
#   negation      отрицания — кризиса нет;
#   quote         цитаты, новости, чужие слова — кризиса у автора нет;
#   other_person  тревога за другого человека — кризиса у автора нет;
#   neutral       обиходные выражения и обычные жалобы — кризиса нет.

explicit:
  - Хочу покончить с собой
  - Я решил покончить жизнь самоубийством
  - думаю о суициде каждый день
  - Завтра я убью себя
  - Я хочу умереть
  - я больше не хочу жить на этом свете
  - не хочу больше жить, всё
  - Хочется просто взять и повеситься
  - Думаю спрыгнуть с крыши нашего дома
  - Собираюсь наглотаться таблеток сегодня ночью
  - Я порезала себе вены
  - Режу себя когда становится невыносимо
  - вчера опять резала руки
  - Прижигаю себя сигаретой, чтобы стало легче
  - Мне хочется причинить себе боль
  - Хочу нанести себе увечья
  - У меня есть план, как свести счёты с жизнью
  - Подумываю свести счёты с жизнью
  - Жить незачем, я хочу умереть
  - Лучше я убью себя, чем так дальше
  - хочу сдохнуть
  - Я его убью, клянусь, вот прямо сегодня
  - Хочу убить свою жену
  - Я задушу эту тварь
  - Возьму нож и порежу их всех
  - Я готов кого-нибудь убить
  - Планирую суицид на выходных
  - Хочется лечь под поезд
  - Я думала броситься под машину
  - Вчера пыталась покончить с собой

implicit:
  - Всем будет лучше без меня
  - Скоро всё это закончится, я уже со всеми попрощалась
  - Раздала свои вещи, они мне больше не понадобятся
  - Написала письма родным на случай, если меня не станет
  - Купила таблетки, упаковки как раз хватит
  - Стою на крыше и смотрю вниз
  - Устала быть, хочу чтобы всё прекратилось навсегда
  - Я не вижу другого выхода кроме как уйти из жизни
  - Хочу исчезнуть насовсем, чтобы меня больше не было
  - Это моё последнее сообщение
  - Простите меня за всё, больше вы меня не увидите
  - Меня скоро не будет, и никто не заметит
  - Я для всех обуза, им без меня станет легче
  - Завещание написал, дела закончил, осталось немного
  - Хочу заснуть и больше никогда не проснуться, и сегодня я это устрою
  - Проверил, какая высота у моста, должно хватить
  - Мне здесь больше нечего делать, пора заканчивать
  - Веревку я уже купил
  - Я нашла способ, как прекратить эту боль раз и навсегда
  - Сегодня всё закончится, не ищите меня
  - Попрощайся за меня с мамой
  - Я больше не буду никому мешать, обещаю, уже совсем скоро
  - Он за всё заплатит, я уже знаю, где он живёт, и ружьё дома есть
  - Ещё раз тронет, и живым отсюда не выйдет
  - Вчера стояла у окна на девятом этаже и думала шагнуть

passive:
  - Лучше бы я не просыпалась утром
  - Иногда думаю, что было бы проще вообще не жить
  - Хорошо бы просто не проснуться
  - Порой думаю о смерти, но ничего такого делать не собираюсь
  - Было бы неплохо, если бы меня сбила машина
  - Иногда жалею, что вообще родилась
  - Не отказалась бы уснуть и не просыпаться
  - Бывает, думаю, что умереть было бы легче

negation:
  - Я никогда не хотел покончить с собой
  - Мыслей о самоубийстве у меня нет
  - Нет, убивать себя я точно не собираюсь
  - Не думаю о суициде, просто устала
  - Себя я не режу и никогда не резала
  - Умереть не хочу, хочу чтобы стало полегче
  - Нет у меня желания причинить себе вред
  - Никого убивать я не собираюсь, просто злюсь
  - Я не собираюсь сводить счёты с жизнью, не волнуйтесь
  - С суицидом это никак не связано
  - Ни разу не думала о том, чтобы умереть
  - Жить хочу, просто сейчас тяжело

quote:
  - В фильме герой говорит "я хочу умереть" и уходит в закат
  - Читала статью о том, как предотвратить самоубийство среди подростков
  - В новостях сказали, что мужчина покончил с собой в тюрьме
  - '"Быть или не быть" — учим сейчас этот монолог в школе'
  - Пишу курсовую про суицид у Достоевского
  - В песне поётся, что он хочет умереть молодым
  - Анна Каренина бросилась под поезд, мы проходили на литературе
  - На лекции разбирали статистику самоубийств в Европе
  - В игре надо убить дракона и спасти деревню
  - Психолог спрашивал, были ли у меня мысли о самоубийстве, я ответила что нет

other_person:
  - Подруга сказала, что хочет умереть, я очень за неё боюсь
  - Мой брат резал себе руки, как ему помочь
  - Мама говорит, что не хочет жить
  - Сын написал, что покончит с собой, что делать
  - Коллега грозилась убить себя после увольнения

neutral:
  - Я сегодня весь день убила на этот отчёт
  - Умираю со смеху с этого видео
  - Устал как собака, хочу спать
  - Убиться можно с этими пробками
  - Эта жара меня просто убивает
  - Мне до смерти надоела эта работа
  - Режу салат на кухне и слушаю подкаст
  - Опять всё бесит, но вроде справляюсь
  - Сдохла батарея в телефоне
  - Тяжёлая неделя, хочется в отпуск
  - Плохо сплю и часто тревожусь перед работой
  - С парнем поссорились, грустно
  - На работе завал, начальник давит
  - Вешаю новые полки в коридоре
  - Прыгнула с парашютом на день рождения, очень понравилось
