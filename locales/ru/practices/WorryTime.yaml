term: WorryTime_
steps:
- Выделите короткое постоянное время, 10–15 минут почти каждый день. Запишите в него тревоги и подумайте,
  что с ними можно сделать.
- Если тревога приходит в другое время, скажите себе, что вернётесь к ней в отведённые минуты, и переключитесь
  на то, что происходит сейчас.
- 'Разделите тревоги: на что вы можете повлиять, а на что нет.'
- 'Для первых составьте конкретный план: что, как и когда сделать. Вторые признайте и отпустите, займитесь
  чем-то другим или отдохните.'
limits:
- Не подходит при навязчивых мыслях и ритуалах.
sources:
- title: NHS Every Mind Matters, Tackling your worries
  url: https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-worries/
