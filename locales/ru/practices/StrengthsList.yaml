term: StrengthsList_
steps:
- Запишите хотя бы пять своих положительных качеств или того, что у вас получается.
- Добавьте хорошее, что о вас говорили другие.
- Перечитывайте список и дополняйте его, когда что-то получится.
limits:
- 'Это не обязательство: если не получается, это не повод для самокритики.'
sources:
- title: NHS, Raising low self-esteem
  url: https://www.nhs.uk/mental-health/self-help/tips-and-support/raise-low-self-esteem/
