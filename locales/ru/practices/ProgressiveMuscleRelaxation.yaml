term: ProgressiveMuscleRelaxation_
steps:
- Найдите тихое место, где вас не потревожат.
- 'По очереди напрягайте группы мышц: стопы, ноги, живот, кисти и руки, плечи, челюсть и лицо, глаза.'
- Каждую группу сожмите на пять счётов, затем отпустите и заметьте ощущение расслабления. Повторите ещё
  два раза.
- В конце сделайте три глубоких вдоха и дайте телу успокоиться.
limits:
- 'Упражнение не должно вызывать боль: если напряжение неприятно, пропустите эту часть тела.'
- Если появились неприятные ощущения или воспоминания, остановитесь.
- При тяжёлых болезнях сердца и лёгких, тяжёлой астме или непролеченных последствиях травмы сначала посоветуйтесь
  со специалистом.
sources:
- title: Oxford Health NHS, Progressive muscle relaxation
  url: https://oxfordhealth.nhs.uk/camhs/self-care/sleep/relaxation/progressive-muscle-relaxation/
- title: Bradford Teaching Hospitals NHS, Relaxation
  url: https://www.bradfordhospitals.nhs.uk/wp-content/uploads/2022/12/Therapy-Services-Relaxing.pdf
