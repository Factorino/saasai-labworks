term: LimitNewsAndSocialMedia_
steps:
- Заметьте, какие новости тревожат или огорчают вас, и сократите их.
- Выберите одно-два определённых времени в день, когда вы проверяете новости.
- Читайте только надёжные источники и в основном ради того, что поможет что-то практически сделать.
limits:
- Это не означает полного отказа от общения онлайн.
sources:
- title: WHO, Mental health and psychosocial considerations during the COVID-19 outbreak
  url: https://www.who.int/docs/default-source/coronaviruse/mental-health-considerations.pdf
