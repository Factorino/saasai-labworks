term: Mindfulness_
steps:
- 'Замечайте обычные ощущения: вкус еды, движение воздуха, шаги.'
- Выберите для этого постоянное время дня.
- 'Когда приходят мысли и чувства, называйте их про себя: «вот тревожная мысль».'
- Смотрите на них как на проходящие события в уме и не старайтесь от них избавиться.
limits:
- 'Подходит не всем: некоторым людям от этого становится хуже. Если так произошло, прекратите.'
- Будьте осторожны при ощущении отстранённости от себя и мира.
sources:
- title: NHS, Mindfulness
  url: https://www.nhs.uk/mental-health/self-help/tips-and-support/mindfulness/
