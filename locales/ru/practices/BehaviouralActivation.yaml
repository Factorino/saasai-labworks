term: BehaviouralActivation_
steps:
- Выберите одно приятное занятие и одно обычное дело, которое вы забросили.
- Разбейте их на маленькие шаги. Например, вместо уборки всей квартиры — только одна её часть.
- Назначьте точный день и время. Для начала хватит одного раза на этой неделе.
- Поставьте напоминание или попросите близкого человека поддержать вас.
- 'Делайте запланированное, даже если настроения нет: настроение часто улучшается уже после действия.'
limits:
- Начинайте постепенно, с посильных шагов.
sources:
- title: WHO, Problem Management Plus (PM+), 2018
  url: https://www.who.int/publications/i/item/WHO-MSD-MER-18.5
