term: SleepHygiene_
steps:
- Ложитесь и вставайте в одно и то же время, в том числе в выходные.
- Избегайте дневного сна, особенно дольше 30 минут ближе к вечеру.
- Двигайтесь днём, но интенсивные нагрузки заканчивайте за три часа до сна.
- 'Кофеин лучше не употреблять после 14:00. Перед сном избегайте никотина и алкоголя: алкоголь нарушает
  сон во второй половине ночи.'
- Лёгкий ужин за 2–3 часа до сна, спокойный вечерний ритуал, прохладная, тёмная и тихая комната.
- Днём бывайте на естественном свету, а перед сном откладывайте телефон и компьютер.
limits:
- При стойкой бессоннице обратитесь к специалисту.
sources:
- title: Doncaster and Bassetlaw NHS, Sleep hygiene
  url: https://www.dbth.nhs.uk/wp-content/uploads/2025/09/Sleep-hygiene-leaflet-1.pdf
