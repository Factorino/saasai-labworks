term: GradualExposure_
steps:
- Заметьте ситуацию, которой вы избегаете из-за тревоги. Избегание со временем усиливает тревогу.
- Начните с самого лёгкого для вас шага навстречу этой ситуации.
- Повторяйте его, пока он не станет более посильным, и только потом переходите к следующему.
limits:
- Начинайте с самых лёгких шагов.
- Не применяйте к воспоминаниям о травмирующем событии и навязчивостям без специалиста.
sources:
- title: NHS Every Mind Matters, Anxiety
  url: https://www.nhs.uk/every-mind-matters/mental-health-issues/anxiety/
