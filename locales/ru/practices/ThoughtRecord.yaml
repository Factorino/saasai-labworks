term: ThoughtRecord_
steps:
- Выберите недавнюю трудную ситуацию и опишите её.
- Запишите, что вы почувствовали сначала и какие мысли были неприятнее всего.
- Запишите факты, которые подтверждают эти мысли, и факты, которые им противоречат.
- Сформулируйте более реалистичную или нейтральную мысль.
- Отметьте, как вы чувствуете себя теперь. Запись на бумаге или в телефоне поможет вернуться к этому позже.
limits:
- Не используйте для разбора травмирующих событий и навязчивых мыслей.
sources:
- title: NHS Every Mind Matters, Thought record
  url: https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/thought-record/
