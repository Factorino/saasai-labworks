term: RegularRoutine_
steps:
- Старайтесь есть и ложиться спать примерно в одно и то же время.
- Оставьте в дне занятия, которые раньше приносили удовольствие.
- 'Сокращайте алкоголь или откажитесь от него: он может ухудшать состояние.'
limits:
- 'Без жёстких требований: отступления от распорядка не повод себя винить.'
sources:
- title: WHO, Depressive disorder (depression)
  url: https://www.who.int/news-room/fact-sheets/detail/depression
