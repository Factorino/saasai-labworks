term: TimeOut_
steps:
- Заранее договоритесь с близкими о паузе в трудном разговоре.
- Заметьте напряжение как можно раньше, не дожидаясь, пока вы вскипите.
- 'Ровным голосом скажите, что вы делаете: например, «я завожусь, давай сделаем перерыв и поговорим через
  час».'
- Выйдите из ситуации и займитесь чем-то успокаивающим. Алкоголь и вождение в таком состоянии не подходят.
- Вернитесь в обещанное время. Если злость не прошла, скажите об этом и договоритесь о другом времени.
limits:
- Если гнев уже причинил кому-то вред, обратитесь к врачу или специалисту.
sources:
- title: NSW Government, Sensible and Simple Time Outs
  url: https://tap.nsw.gov.au/documents/resources/Worksheet_7-Sensible-and-Simple-time-outs_Accessible.pdf
