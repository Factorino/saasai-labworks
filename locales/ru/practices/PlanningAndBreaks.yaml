term: PlanningAndBreaks_
steps:
- В течение недели отмечайте дела, которые вы откладываете, и ищите, что их объединяет.
- Разделите неделю на обычные дела, обязательные и приятные и следите, чтобы хватало всех трёх.
- 'Для отложенного дела поставьте напоминание и таймер на пять минут: иногда этого хватает, чтобы начать.'
- Чередуйте трудное с приятным, чтобы между нагрузками был отдых.
- Для обязательных дел выберите удобное время и место и заранее придумайте себе награду.
limits: []
sources:
- title: NHS Every Mind Matters, Tackling your to-do list
  url: https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-to-do-list/
