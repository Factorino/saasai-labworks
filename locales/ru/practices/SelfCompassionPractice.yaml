term: SelfCompassionPractice_
steps:
- Заметьте, когда начинаете себя ругать или обесценивать свои усилия.
- Спросите себя, что вы сказали бы другу в такой же ситуации.
- Скажите себе то же самое, теми же словами и тем же тоном.
limits:
- 'Не заменяет помощь при сильной самокритике: долгая низкая самооценка — повод поговорить со специалистом.'
sources:
- title: NHS, Raising low self-esteem
  url: https://www.nhs.uk/mental-health/self-help/tips-and-support/raise-low-self-esteem/
