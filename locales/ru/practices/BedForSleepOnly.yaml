term: BedForSleepOnly_
steps:
- Используйте кровать только для сна. Телефон, сериалы, учёбу и работу перенесите в другое место.
- Вставайте в течение получаса после пробуждения.
- Ложитесь и выключайте свет, когда чувствуете сонливость, а не просто усталость.
- Если не удаётся заснуть примерно полчаса, встаньте, перейдите в другую тихую комнату и займитесь чем-то
  спокойным. Вернитесь, когда снова захочется спать.
limits:
- Жёсткое ограничение времени сна в эту практику не входит.
sources:
- title: East London NHS, Good bed, bad bed
  url: https://elft.nhs.uk/sites/default/files/2022-06/good_bed_bad_bed.pdf
