term: BreathingPractice_
steps:
- 'Устройтесь удобно: сидя, стоя или лёжа. Ослабьте тесную одежду.'
- Дышите глубоко и спокойно, чтобы воздух доходил до живота. Не заставляйте себя вдыхать сильнее, чем
  получается.
- Вдыхайте через нос, выдыхайте через рот. Если помогает, считайте про себя от одного до пяти на вдохе
  и на выдохе. Сразу до пяти может не получиться, это нормально.
- Продолжайте хотя бы пять минут. Лучше всего делать упражнение каждый день.
limits:
- Если есть проблемы с дыханием, сначала посоветуйтесь с врачом.
sources:
- title: NHS, Breathing exercises for stress
  url: https://www.nhs.uk/mental-health/self-help/guides-tools-and-activities/breathing-exercises-for-stress/
