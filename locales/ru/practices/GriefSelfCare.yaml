term: GriefSelfCare_
steps:
- Говорите о том, что чувствуете, с близкими или с теми, кто пережил похожее. Не держите всё в себе.
- Регулярно ешьте, отдыхайте и двигайтесь. Ставьте небольшие цели на день.
- Избегайте алкоголя и наркотиков как способа справиться.
- Отложите крупные решения, такие как переезд или смена работы, пока не пройдёт время.
- 'Не вините себя за то, что постепенно возвращаетесь к жизни: это не предательство.'
limits:
- Горе нельзя торопить, у каждого оно идёт своим путём.
- Если подавленность держится дольше двух недель или справляться не получается, обратитесь к врачу или
  специалисту.
sources:
- title: NHS, Grief, bereavement and loss
  url: https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/grief-bereavement-loss/
- title: 'University of Huddersfield, SHARP: Coping with grief and loss'
  url: https://research.hud.ac.uk/media/assets/document/research/sharp/managingyourproblem/CopingWithGriefAndLossLite.pdf
