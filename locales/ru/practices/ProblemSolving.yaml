term: ProblemSolving_
steps:
- 'Составьте список проблем и разделите их: что можно изменить, что нельзя и что не так важно.'
- Начните с более простой из тех, что можно изменить, и опишите её как можно точнее.
- Запишите все варианты решения, какие придут в голову, не оценивая их.
- 'Выберите самые полезные и составьте план: что, когда и какими маленькими шагами.'
- После попытки посмотрите, что сработало, и при необходимости пройдите шаги заново.
limits:
- Не каждую проблему можно решить.
- 'Этот способ не подходит для ситуаций насилия: там нужна помощь специалистов.'
sources:
- title: WHO, Problem Management Plus (PM+), 2018
  url: https://www.who.int/publications/i/item/WHO-MSD-MER-18.5
