term: GroundingPractice_
steps:
- 'Почувствуйте опору: прижмите стопы к полу, заметьте стул под собой и ткань одежды.'
- 'Назовите про себя пять предметов, которые видите, в подробностях: узор, царапину, точный оттенок.'
- Затем четыре ощущения от прикосновения, три звука, два запаха и один вкус. Если запаха или вкуса рядом
  нет, вспомните любимый.
- Если нужно отвлечься сильнее, назовите себе своё имя, где вы находитесь и какое сегодня число, или считайте
  от тысячи назад, вычитая по семь.
limits:
- Это помогает пережить трудный момент, но не устраняет его причину.
sources:
- title: Sherwood Forest Hospitals NHS, Grounding exercises
  url: https://www.sfh-tr.nhs.uk/media/x41iiuvv/grounding-exercises-guide.pdf
