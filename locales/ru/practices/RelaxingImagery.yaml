term: RelaxingImagery_
steps:
- Устройтесь удобно и немного подышите спокойно.
- 'Представьте приятное место: тёплый пляж, любимый вид из окна, звёздный вечер.'
- Постарайтесь представить, что вы там видите, слышите, чувствуете и делаете.
- 'Не торопитесь и не старайтесь слишком сильно: этому навыку нужна практика.'
limits:
- Если образ вызывает тревогу или воспоминания, остановитесь.
- При тяжёлых болезнях сердца и лёгких, тяжёлой астме или непролеченных последствиях травмы сначала посоветуйтесь
  со специалистом.
sources:
- title: Bradford Teaching Hospitals NHS, Relaxation
  url: https://www.bradfordhospitals.nhs.uk/wp-content/uploads/2022/12/Therapy-Services-Relaxing.pdf
