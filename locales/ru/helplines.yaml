# Службы помощи для региона языка: показываются в сводке при срочном направлении.
#
# Номера сверены с официальными источниками: mchs.gov.ru (Центр экстренной
# психологической помощи МЧС России), Фонд поддержки детей, находящихся в трудной
# жизненной ситуации (детский телефон доверия). Для другого региона замените список.

helplines:
  - name: Единый номер экстренных служб
    phone: "112"
    note: Если есть угроза жизни

  - name: Скорая медицинская помощь
    phone: "103"

  - name: Центр экстренной психологической помощи МЧС России
    phone: "+7 495 989-50-50"
    note: Круглосуточно, бесплатно и анонимно

  - name: Детский телефон доверия
    phone: "8 800 2000-122"
    note: Для детей, подростков и родителей; бесплатно и анонимно
