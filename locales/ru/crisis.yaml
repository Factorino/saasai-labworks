# Шаблоны кризисного детектора на русском языке.
#
# Шаблон — слова через пробел; `...` разрешает пропустить до трёх слов между
# соседними словами шаблона. Слова сравниваются по основам (стеммер Snowball),
# поэтому разные формы одного глагола («хочу», «хочет») стоит перечислять
# отдельными шаблонами. Пропуск опаснее ложного срабатывания: при сомнении
# шаблон лучше добавить.

stemmer: russian

# Отрицание в трёх словах перед находкой отменяет её: «никогда не хотел умереть».
# Шаблон, который сам начинается с отрицания («не хочу жить»), не отменяется.
negations: [не, нет, никогда, ни]

# Ближайшее действующее лицо перед находкой решает, о ком речь.
first_person: [я, мне, меня, мной, сам, сама]
others:
  - подруга
  - друг
  - знакомый
  - знакомая
  - мама
  - мать
  - папа
  - отец
  - брат
  - сестра
  - сын
  - дочь
  - муж
  - жена
  - парень
  - девушка
  - ребенок
  - коллега
  - сосед
  - соседка
  - он
  - она
  - они

patterns:
  suicide:
    - покончить ... с собой
    - покончу ... с собой
    - покончила ... с собой
    - покончил ... с собой
    - убить себя
    - убью себя
    - не хочу жить
    - не хочется жить
    - жить не хочу
    - жить не хочется
    - не хочу больше жить
    - не вижу смысла жить
    - нет смысла жить
    - хочу умереть
    - хочется умереть
    - хотел умереть
    - хотела умереть
    - лучше умереть
    - свести счеты с жизнью
    - наложить на себя руки
    - уйти из жизни
    - суицид
    - самоубийство
    - покончить ... жизнь
    - выйти в окно
    - выпрыгнуть ... из окна
    - прыгнуть ... с крыши
    - спрыгнуть ... с крыши
    - повеситься
    - повешусь
    - наглотаться ... таблеток
    - выпить все таблетки
    - отравиться
    - застрелиться
    - вскрыть вены

  self_harm:
    - режу себя
    - режет себя
    - резала себя
    - резал себя
    - резать себя
    - порезать себя
    - порезала себя
    - порезал себя
    - режу руки
    - резать руки
    - порезала руки
    - порезы на руках
    - наношу себе порезы
    - причиняю себе боль
    - причинить себе боль
    - причинить себе вред
    - сделать себе больно
    - делаю себе больно
    - бью себя
    - прижигаю себя
    - селфхарм
    - самоповреждение

  violence:
    - убью его
    - убью ее
    - убью их
    - хочу убить его
    - хочу убить ее
    - хочу убить их
    - хочу убить всех
    - хочу убить кого-нибудь
    - хочется убить его
    - хочется убить ее
    - причинить ему вред
    - причинить ей вред
    - причинить вред другим
    - покалечу
    - задушу
    - зарежу

  indirect:
    - всем будет лучше без меня
    - без меня всем будет лучше
    - без меня ... будет лучше
    - прощальное письмо
    - прощальные письма
    - прощальную записку
    - раздаю свои вещи
    - раздала свои вещи
    - раздал свои вещи
    - попрощался со всеми
    - попрощалась со всеми
    - скоро меня не станет
    - больше меня не увидите
    - купил веревку
    - купила веревку
    - коплю таблетки
    - накопила таблетки
    - накопил таблетки

  passive:
    - лучше бы меня не было
    - лучше бы я не рождался
    - лучше бы я не рождалась
    - хочу исчезнуть
    - хочется исчезнуть
    - уснуть и не проснуться
    - не проснуться
    - не хочу просыпаться
    - устал жить
    - устала жить
    - зачем я живу
