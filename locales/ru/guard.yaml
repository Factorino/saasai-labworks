# Шаблоны проверки ответов системы на русском языке (SPEC §6.2).
#
# Синтаксис шаблонов тот же, что в crisis.yaml: слова через пробел, `...` —
# пропуск до трёх слов, слова сравниваются по основам. Отрицание перед
# находкой отменяет её: «это не диагноз» не считается утверждением диагноза.

stemmer: russian
negations: [не, нет, никогда, ни]

patterns:
  # Название расстройства как факт о пользователе.
  diagnosis:
    - у вас ... депрессия
    - у вас ... расстройство
    - у вас ... невроз
    - у вас ... птср
    - у вас ... окр
    - у вас ... сдвг
    - у вас ... шизофрения
    - у вас ... биполярное
    - у вас ... анорексия
    - у вас ... булимия
    - у вас ... психоз
    - вы страдаете
    - похоже на депрессию
    - похоже на ... расстройство
    - это депрессия
    - это ... расстройство
    - клиническая депрессия
    - ваш диагноз
    - ставлю ... диагноз
    - диагностирую

  # Лекарства и советы по ним.
  medication:
    - антидепрессант
    - антидепрессанты
    - транквилизатор
    - транквилизаторы
    - нейролептик
    - нейролептики
    - снотворное
    - успокоительное
    - седативное
    - дозировка
    - дозировку
    - сертралин
    - флуоксетин
    - пароксетин
    - эсциталопрам
    - циталопрам
    - флувоксамин
    - венлафаксин
    - дулоксетин
    - миртазапин
    - амитриптилин
    - тразодон
    - агомелатин
    - вортиоксетин
    - бупропион
    - феназепам
    - алпразолам
    - диазепам
    - лоразепам
    - клоназепам
    - гидроксизин
    - атаракс
    - кветиапин
    - оланзапин
    - рисперидон
    - арипипразол
    - галоперидол
    - карбонат лития
    - вальпроат
    - ламотриджин
    - афобазол
    - корвалол
    - валокордин

  # Обещание результата.
  promise:
    - обязательно станет лучше
    - обязательно поможет
    - точно поможет
    - точно станет лучше
    - гарантирую
    - гарантированно
    - навсегда избавит
    - навсегда избавиться
    - вылечит
    - излечит
    - сто процентов

  # Обесценивание переживаний.
  devaluation:
    - это ерунда
    - это пустяки
    - ничего страшного
    - не преувеличивайте
    - не драматизируйте
    - не накручивайте себя
    - у всех бывает
    - возьмите себя в руки
    - соберитесь
    - просто перестаньте
    - вам просто кажется
    - не стоит переживать
    - не о чем беспокоиться

  # Совет прекратить лечение.
  stop_treatment:
    - бросьте принимать
    - прекратите принимать
    - перестаньте принимать
    - не принимайте ... лекарства
    - не принимайте ... препараты
    - отмените ... препарат
    - откажитесь от лечения
    - откажитесь от терапии
    - бросьте терапию
    - не нужно лечиться

# Коды МКБ-10 и МКБ-11 для психических расстройств и упоминание классификации.
codes:
  - '\b[FФ]\d{2}(?:\.\d{1,2})?\b'
  - '\b6[A-E]\d{2}(?:\.\d{1,2})?\b'
  - '\bМКБ\b'

# Утверждения об уровне срочности; расхождение с правилами — нарушение.
levels:
  L0:
    - можно не обращаться
    - не нужно обращаться
    - обращаться не нужно
    - обращаться к специалисту не нужно
    - помощь специалиста не нужна
    - специалист не нужен
    - само пройдет
  L1:
    - желательно рассмотреть консультацию
  L2:
    - рекомендуется обратиться к специалисту
    - нужно обратиться к специалисту
  L3:
    - необходимо срочно обратиться
    - срочно обратитесь
    - немедленно обратитесь
    - срочно нужна помощь
