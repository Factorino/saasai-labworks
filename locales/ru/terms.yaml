descriptions:
  Manifestation_: Всё, что человек замечает в чувствах, теле, мыслях или поведении.
  EmotionalManifestation_: Изменения эмоционального состояния.
  Anxiety_: Напряжение, нервозность, страх, что случится плохое.
  ExcessiveWorry_: Постоянное беспокойство о многом, которое трудно остановить.
  PanicEpisode_: Внезапная волна сильного страха, которая со временем проходит.
  SocialFear_: Сильный страх оценки, неловкости или отвержения в социальных ситуациях.
  SpecificFear_: Сильный страх конкретного предмета или ситуации, например высоты или полётов.
  FearOfBeingTrapped_: 'Страх мест, откуда трудно уйти или где трудно получить помощь: толпа, транспорт.'
  HealthWorry_: Постоянное беспокойство о том, что есть или будет серьёзная болезнь.
  LowMood_: Подавленность, грусть, пустота большую часть времени.
  LossOfInterest_: Потеря интереса и удовольствия от того, что раньше радовало.
  Hopelessness_: Ощущение, что впереди нет ничего хорошего и ничего не изменится.
  NegativeSelfView_: Резко негативный взгляд на себя.
  ExcessiveGuilt_: Вина намного сильнее, чем требует ситуация.
  LowSelfWorth_: Ощущение никчёмности и недостаточной хорошести.
  Shame_: Глубокий стыд за себя, желание спрятаться.
  HarshSelfCriticism_: Очень жёсткая самокритика или требование совершенства.
  BodyImageWorry_: Сильное недовольство своим телом или внешностью.
  Irritability_: Раздражение и злость возникают легче, чем обычно.
  EmotionalNumbness_: Почти нет эмоций, будто чувства выключены.
  UnusuallyHighEnergy_: Необычно приподнятое настроение и энергия, мало сна, импульсивность.
  MoodSwings_: Резкие и быстрые перепады настроения без ясной причины.
  EmotionalOverwhelm_: Ощущение, что навалилось слишком много сразу.
  WorkDisengagement_: Отстранённость, цинизм или ощущение неэффективности в работе.
  LongingForDeceased_: Сильная тоска по умершему или постоянные мысли о нём.
  SomaticManifestation_: Изменения, которые человек замечает в теле, сне или аппетите.
  SleepDisturbance_: Сон заметно хуже, короче или длиннее обычного.
  Insomnia_: Трудности с засыпанием, частые пробуждения или слишком ранний подъём.
  Hypersomnia_: Сон намного дольше обычного при сохраняющейся сонливости.
  Nightmares_: Частые плохие сны, после которых человек просыпается или не может успокоиться.
  AppetiteChange_: Человек ест заметно больше или меньше обычного.
  Fatigue_: Усталость и нехватка сил даже после отдыха.
  MuscleTension_: Мышцы напряжены, их трудно расслабить.
  BodilyArousalSigns_: Телесные реакции вроде сильного сердцебиения или дрожи; причину может проверить
    врач.
  HeartSensations_: Заметное сильное или частое сердцебиение, ощущение скачков давления.
  BreathingDifficulty_: Нехватка воздуха, невозможность вдохнуть полной грудью, без тяжёлого состояния.
  TremblingAndSweating_: Дрожь или потливость сильнее, чем можно объяснить ситуацией.
  Dizziness_: Лёгкость в голове и лёгкая неустойчивость, не внезапная и не сильная.
  DigestiveUpset_: Тошнота, расстройство желудка или другой дискомфорт в ЖКТ.
  OtherBodilySymptoms_: Телесные жалобы с неясной причиной, которые сначала должен проверить врач.
  EarRinging_: Звон, гул или другой шум в ушах без внешнего источника.
  Headache_: Обычная головная боль или давление в голове без внезапного сильного начала.
  BodyPain_: Боль в спине, шее или других частях тела.
  NumbnessOrTingling_: Лёгкое онемение или покалывание, не на всей одной стороне тела.
  MenstrualProblems_: Болезненные или нерегулярные месячные и другие проблемы цикла.
  SexualDifficulties_: Сниженное влечение, боль или другие трудности в сексе.
  UrgentBodilyWarningSigns_: Телесные признаки, при которых нужна срочная медицинская помощь, а не самопомощь.
  SuddenHearingOrBalanceChange_: Внезапная потеря слуха или сильное вращательное головокружение.
  StrokeLikeSigns_: Внезапное опущение лица, слабость с одной стороны, нарушения речи или зрения, резкая
    сильная головная боль.
  ChestPainOrSevereBreathing_: Боль или сдавливание в груди, сильное затруднение дыхания.
  LossOfConsciousness_: Обморок или потеря сознания.
  CognitiveManifestation_: Изменения мышления, внимания, памяти или ощущения реальности.
  ThinkingDifficulties_: Трудности с вниманием, памятью или принятием решений.
  ConcentrationProblems_: Трудно сосредоточиться и запоминать.
  MemoryProblems_: Забывчивость сильнее обычного.
  DecisionDifficulty_: Трудно принимать даже небольшие решения.
  ThreatVigilance_: Постоянное ожидание опасности и настороженность.
  IntrusiveThoughts_: Непрошеные мысли и образы, приходящие против воли.
  ObsessiveThoughts_: Одна и та же тревожащая мысль возвращается снова и снова.
  ReexperiencingEvent_: Прошлое пугающее событие переживается так, будто происходит сейчас.
  Rumination_: Снова и снова прокручивать прошлые события или проблемы, не находя выхода.
  MeaningAndIdentity_: Вопросы о том, кто ты и что придаёт жизни смысл.
  LackOfPurpose_: Ощущение, что в жизни нет смысла или направления.
  IdentityConfusion_: Неуверенность в том, кто ты и что для тебя важно.
  Dissociation_: Ощущение отстранённости от себя или от происходящего.
  Depersonalization_: Ощущение, что смотришь на себя со стороны.
  Derealization_: Ощущение, что окружающий мир нереален или странен.
  SelfHarmThoughts_: Мысли о смерти или самоповреждении, характер которых пока не уточнён.
  PassiveDeathThoughts_: Желание не существовать или не проснуться без намерения что-либо делать.
  ActiveSelfHarmThoughts_: Мысли о том, чтобы на самом деле навредить себе или покончить с собой.
  PsychoticSign_: Человек слышит или видит то, чего не замечают другие, или твёрдо придерживается необычных
    убеждений.
  BehaviouralManifestation_: Изменения в том, что человек делает или избегает делать.
  SocialWithdrawal_: Уход от общения с друзьями, семьёй и другими людьми.
  Avoidance_: Избегание трудных ситуаций, мест или напоминаний.
  Restlessness_: Трудно усидеть на месте и успокоиться телом.
  CompulsiveActions_: Повторяющиеся действия вроде проверок или мытья, чтобы снизить тревогу.
  AngerOutbursts_: 'Внезапные сильные вспышки гнева: крики, порча вещей.'
  SelfNeglect_: 'Отказ от базовой заботы о себе: гигиены, нормальной еды, повседневных нужд.'
  SelfHarmBehaviour_: Намеренное причинение себе вреда, например порезы или ожоги.
  SlowedMovement_: Движения или речь заметно медленнее обычного.
  Procrastination_: Откладывание дел, даже когда это создаёт проблемы.
  ImpulsiveOrRiskyBehaviour_: 'Импульсивные поступки, которые могут быть рискованными: опасная езда,
    траты.'
  AddictiveBehaviours_: Привычки, которые трудно контролировать и которые создают проблемы.
  SubstanceUse_: Употребление алкоголя или наркотиков, которое трудно контролировать или которое создаёт
    проблемы.
  Gambling_: Ставки и азартные игры, которые трудно прекратить.
  ExcessiveGaming_: Видеоигры или экраны вытесняют другие части жизни.
  CompulsiveSexualBehaviour_: Сексуальные побуждения или поведение, которые трудно контролировать и которые
    создают проблемы.
  CompulsiveShopping_: Покупки или траты, которые трудно контролировать.
  InterpersonalDifficulties_: Повторяющиеся трудности в том, как человек строит отношения с другими.
  TrustDifficulties_: Трудно доверять и сближаться с другими.
  FearOfRejection_: Сильный страх отвержения, критики или того, что бросят.
  DifficultySettingBoundaries_: Трудно отказывать и отстаивать себя.
  DisorderedEating_: Жёсткие правила в еде, переедание, очищение или постоянная тревога из-за веса и
    фигуры.
  ViolenceThreat_: Мысли или угрозы серьёзно навредить другому человеку.
  Stressor_: Ситуация или событие в жизни, создающие нагрузку.
  WorkStressor_: Нагрузка, связанная с работой или её потерей.
  Workload_: Слишком много работы, высокий темп или постоянные дедлайны.
  WorkSchedule_: Сменный или ночной график, переработки, непредсказуемые часы.
  LowWorkControl_: Мало влияния на свою работу или нечёткая роль.
  WorkplaceConflict_: Конфликты, притеснение или травля на работе.
  JobInsecurity_: Страх потерять работу или нестабильный заработок.
  JobLoss_: Потеря работы или безработица.
  CareerUncertainty_: Неопределённость с карьерой или будущей работой.
  StudyStressor_: Нагрузка, связанная со школой или вузом.
  AcademicPressure_: Давление из-за оценок и учебной нагрузки.
  ExamStress_: Стресс из-за экзаменов и сессии.
  SchoolBullying_: Травля или унижения в школе или вузе.
  RelationshipStressor_: Нагрузка, связанная с отношениями с другими людьми.
  PartnerConflict_: Повторяющиеся ссоры или напряжение с партнёром.
  BreakupOrDivorce_: Расставание с партнёром или развод.
  FamilyConflict_: Конфликты с родителями, детьми или другими родственниками.
  Loneliness_: Одиночество, слишком мало контактов с другими.
  DiscriminationOrExclusion_: Несправедливое отношение или исключение из группы из-за того, кто ты есть.
  ParentingStress_: Нагрузка от воспитания детей или трудностей с ребёнком.
  Infidelity_: Измена или предательство партнёра.
  LossStressor_: Потеря значимого человека.
  Bereavement_: Смерть близкого человека.
  PregnancyLoss_: Потеря беременности.
  PetLoss_: Смерть или потеря домашнего животного.
  LifeTransition_: Крупная перемена, требующая адаптации, даже если она приятная.
  Relocation_: Переезд в новый дом, город или страну.
  JobChange_: Новая работа или смена профессии.
  Retirement_: Завершение трудовой жизни.
  Marriage_: Свадьба или начало совместной жизни.
  NewFamilyMember_: Новый ребёнок или другой новый член семьи.
  ForcedMigration_: Вынужденный отъезд из дома из-за опасности или тяжёлых условий.
  PregnancyOrPostpartum_: Беременность или первые месяцы после родов.
  AgingAndMidlife_: Привыкание к возрасту, середина жизни или отъезд детей.
  HealthStressor_: Нагрузка из-за проблем со здоровьем, своих или близкого.
  OwnIllness_: Собственная серьёзная болезнь.
  RelativeIllness_: Серьёзная болезнь близкого человека.
  Disability_: Инвалидность или недавняя потеря физических возможностей.
  CaregivingBurden_: Уход за родственником, которому нужно много заботы.
  Infertility_: Трудности с тем, чтобы завести ребёнка.
  FinancialAndLegalStressor_: Нагрузка из-за денег, жилья или юридических проблем.
  FinancialHardship_: Нехватка денег на необходимое.
  HousingInsecurity_: Угроза потери жилья.
  LegalProblems_: Суд, арест или другие проблемы с законом.
  SocialContextStressor_: Нагрузка от внешнего мира и общественной среды.
  WorldEvents_: Переживания из-за новостей, политики или положения в мире.
  SocialMediaPressure_: Давление соцсетей, сравнение себя с другими онлайн, вредный контент.
  AcculturationStress_: Трудности адаптации к новой культуре или языку.
  TraumaticStressor_: Пугающее или опасное пережитое событие.
  AccidentOrDisaster_: Серьёзная авария или катастрофа.
  WarConflict_: Переживание войны или вооружённого конфликта.
  Assault_: Физическое нападение.
  SexualViolence_: Сексуальное нападение или нежеланные сексуальные действия.
  ChildhoodAbuse_: Насилие или жестокое пренебрежение в детстве.
  OngoingDomesticViolence_: Человека сейчас бьют, запугивают или контролируют дома.
  LifeDomain_: Часть жизни, на которую могут влиять трудности.
  WorkAndStudy_: Насколько человек справляется с работой и учёбой.
  Work_: Насколько человек справляется с работой.
  Study_: Насколько человек справляется с учёбой.
  Relationships_: Как человек ладит с близкими людьми.
  PartnerRelationship_: Отношения с партнёром.
  FamilyRelationships_: Отношения с членами семьи.
  ParentalRole_: Забота о детях и их воспитание.
  FriendsAndSocialLife_: Общение с друзьями и знакомыми.
  DailyLife_: Справляться с обычными повседневными делами.
  HouseholdTasks_: Домашние дела и ведение хозяйства.
  SelfCare_: Повседневная способность заботиться о гигиене, еде и отдыхе.
  Finances_: Оплата счетов и повседневное управление деньгами.
  LeisureAndCommunity_: Свободное время и участие в жизни сообщества.
  Leisure_: Хобби, отдых и другие приятные занятия.
  CommunityParticipation_: Участие в местных, религиозных и других групповых занятиях.
  ConditionCluster_: Группа связанных проявлений для подбора практик; не диагноз.
  SymptomCluster_: Группа по тому, что человек замечает у себя.
  LifeEventCluster_: Группа по тому, что происходит в жизни человека.
  AnxietyCluster_: Проявления, связанные с беспокойством, страхом и избеганием.
  DepressiveCluster_: Проявления, связанные с подавленностью и потерей интереса.
  StressCluster_: Проявления, связанные с напряжением и перегрузкой.
  SleepDisturbanceCluster_: Проявления, связанные с трудностями со сном.
  TraumaReactionCluster_: Проявления, которые могут возникать после пугающего события.
  RepetitiveThoughtsAndActionsCluster_: Проявления, связанные с повторяющимися мыслями и действиями.
  EmotionalDisconnectionCluster_: Проявления, связанные с онемением и отстранённостью.
  SelfWorthCluster_: Проявления, связанные с тем, как человек видит и ценит себя.
  GriefCluster_: Потребности в поддержке после потери; горе само по себе естественная реакция.
  RelationshipDifficultiesCluster_: Потребности в поддержке при трудностях с другими людьми.
  LifeChangeCluster_: Потребности в поддержке при адаптации к большим переменам.
  PracticalProblemsCluster_: Потребности в поддержке при проблемах с работой, учёбой, здоровьем, деньгами
    или законом.
  UrgencyLevel_: Насколько скоро стоит обратиться к специалисту.
  L0_: Пока можно попробовать практики самопомощи и понаблюдать.
  L1_: Желательно рассмотреть консультацию.
  L2_: Рекомендуется обратиться к специалисту.
  L3_: Необходимо срочно обратиться за помощью.
  Practice_: Безопасное немедикаментозное упражнение, которое можно выполнять самостоятельно.
  BodyCalmingPractice_: Упражнения, успокаивающие тело.
  BreathingPractice_: Медленное ровное дыхание, помогающее телу успокоиться.
  ProgressiveMuscleRelaxation_: Мягкое напряжение и расслабление групп мышц.
  GroundingPractice_: Использование органов чувств, чтобы вернуть внимание к настоящему моменту.
  RelaxingImagery_: Подробное представление спокойного безопасного места для расслабления.
  ThoughtPractice_: Упражнения для работы с мыслями и чувствами.
  WorryTime_: Короткое ежедневное время для записи беспокойств, чтобы они не заполняли весь день.
  ThoughtRecord_: Запись мысли и проверка доводов за и против.
  MoodDiary_: Краткие записи о настроении и событиях дня.
  SelfCompassionPractice_: Отношение к себе с той же добротой, что и к другу.
  Mindfulness_: Мягкое внимание к настоящему моменту, дыханию и мыслям без оценки.
  StrengthsList_: Запись своих сильных сторон, маленьких успехов и добрых слов других.
  LimitNewsAndSocialMedia_: Ограничение новостей и соцсетей, особенно сравнения себя с другими.
  ActivityPractice_: Упражнения на основе повседневной активности и режима.
  BehaviouralActivation_: Постепенное возвращение к приятным и полезным делам маленькими шагами.
  PhysicalActivity_: Регулярное подходящее движение, даже короткая прогулка.
  RegularRoutine_: Примерно постоянное время для сна, еды и повседневных дел.
  PlanningAndBreaks_: Разделение дня на посильные задачи и настоящие перерывы.
  GradualExposure_: Постепенно встречаться с пугающими ситуациями, начиная с самых лёгких.
  ValuesBasedAction_: Выбор небольших действий, соответствующих тому, что для тебя важно.
  SleepPractice_: Привычки, которые могут улучшить сон.
  SleepHygiene_: Повседневные привычки и условия, облегчающие сон.
  BedForSleepOnly_: Использовать кровать только для сна и вставать, если сон не приходит.
  SupportAndCopingPractice_: Способы получить поддержку и справляться с жизненными проблемами.
  SocialContact_: Общение и время с человеком, которому доверяешь.
  ProblemSolving_: Выбор одной проблемы и разбор возможных шагов.
  GriefSelfCare_: Бережная забота о себе после потери без спешки чувствовать себя лучше.
  TimeOut_: Выйти из накалённой ситуации, пока не успокоишься.
  AssertiveCommunication_: Спокойно и уважительно говорить о своих потребностях через я-высказывания.

