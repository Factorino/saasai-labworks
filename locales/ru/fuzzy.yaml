# Слова, по которым оцениваются длительность, частота и влияние на жизнь.
#
# Ответ своими словами сначала проверяется на число с единицей («три недели»,
# «2–3 недели», «4 дня в неделю»): такое значение точное. Если числа нет,
# ищутся размытые выражения. Каждое выражение даёт термы лингвистической
# переменной: один терм со степенью 1 или несколько со своими степенями.
# Найденные выражения объединяются, чёткое значение получается центром
# тяжести, а степень принадлежности становится уверенностью.
#
# Выражение — шаблон, как в crisis.yaml: слова сравниваются по основам, `...`
# разрешает пропустить до трёх слов. Отрицание в трёх словах перед находкой
# отменяет её, если выражение само не начинается с отрицания. Из вложенных
# находок остаётся самая длинная.
#
# Термы и их функции принадлежности — в knowledge/linguistic_variables.yaml:
#   duration   recently, few_weeks, about_month, long_time      (0–52 недели)
#   frequency  rarely, several_times_a_week, most_days, constantly (0–7 дней в неделю)
#   impact     none, mild, moderate, severe                     (0–3)

stemmer: russian

negations: [не, нет, ни]

# Числа словами. «Пару» сюда не входит: «пару недель» — размытое выражение.
numbers:
  один: 1
  одна: 1
  одну: 1
  одного: 1
  полтора: 1.5
  полторы: 1.5
  два: 2
  две: 2
  двух: 2
  три: 3
  трех: 3
  четыре: 4
  четырех: 4
  пять: 5
  шесть: 6
  семь: 7
  восемь: 8
  девять: 9
  десять: 10

# Единицы после числа и их вес: для длительности — в неделях, для частоты — в
# днях в неделю. Частота больше семи дней обрезается до семи.
units:
  duration:
    день: 0.143
    дня: 0.143
    дней: 0.143
    неделя: 1
    неделю: 1
    недели: 1
    недель: 1
    месяц: 4.345
    месяца: 4.345
    месяцев: 4.345
    год: 52
    года: 52
    лет: 52
  frequency:
    раз в неделю: 1
    раза в неделю: 1
    день в неделю: 1
    дня в неделю: 1
    дней в неделю: 1
    раз в месяц: 0.25
    раза в месяц: 0.25
    раз в день: 7
    раза в день: 7

expressions:
  duration:
    недавно: recently
    не так давно: recently
    на днях: recently
    пару дней: recently
    несколько дней: recently
    на этой неделе: recently
    неделю: {recently: 1, few_weeks: 0.5}
    около недели: {recently: 1, few_weeks: 0.5}
    пару недель: few_weeks
    несколько недель: few_weeks
    пару тройку недель: {few_weeks: 1, about_month: 0.5}
    месяц: about_month
    около месяца: about_month
    больше месяца: {about_month: 1, long_time: 0.5}
    пару месяцев: {about_month: 0.5, long_time: 1}
    несколько месяцев: long_time
    полгода: long_time
    давно: long_time
    уже давно: long_time
    больше года: long_time
    несколько лет: long_time

  frequency:
    редко: rarely
    изредка: rarely
    иногда: rarely
    время от времени: rarely
    раз в неделю: rarely
    раз в месяц: rarely
    пару раз в месяц: rarely
    периодически: {rarely: 1, several_times_a_week: 0.5}
    пару раз в неделю: several_times_a_week
    несколько раз в неделю: several_times_a_week
    через день: {several_times_a_week: 1, most_days: 1}
    часто: {several_times_a_week: 0.5, most_days: 1}
    почти каждый день: most_days
    большую часть дней: most_days
    большинство дней: most_days
    почти всегда: {most_days: 0.5, constantly: 1}
    каждый день: constantly
    ежедневно: constantly
    постоянно: constantly
    все время: constantly
    всегда: constantly
    не проходит: constantly

  impact:
    не мешает: none
    не влияет: none
    не сказывается: none
    немного: mild
    немного мешает: mild
    слегка: mild
    чуть чуть: mild
    не очень мешает: mild
    не сильно мешает: mild
    иногда мешает: {none: 0.5, mild: 1}
    терпимо: mild
    мешает: moderate
    заметно: moderate
    заметно мешает: moderate
    с трудом: moderate
    тяжело справляться: moderate
    сильно мешает: {moderate: 1, severe: 0.5}
    очень сильно мешает: {moderate: 0.5, severe: 1}
    почти не могу: {moderate: 0.5, severe: 1}
    не могу работать: severe
    не могу справляться: severe
    не справляюсь: severe
    совсем не могу: severe
    ничего не могу делать: severe
    не могу встать с кровати: severe
