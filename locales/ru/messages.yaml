# Тексты интерфейса на русском языке.
#
# Ключи — коды доменной модели: уровни срочности, виды сведений (FactKind)
# и коды вариантов ответа. Для другого языка рядом кладётся каталог с тем же
# набором ключей.

greeting: >-
  Здравствуйте. Расскажите своими словами, что вас беспокоит: что вы чувствуете
  и что происходит в жизни. Я задам несколько уточняющих вопросов и подскажу,
  насколько срочно стоит обратиться к специалисту. Это не диагноз и не замена
  консультации.

# Шаблонные ответы на свободные реплики по этапам чата (ChatStage).
replies:
  summary: >-
    Спасибо, что поделились. Сводку выше можно показать специалисту. Если
    состояние изменится, начните новый диалог.
  crisis: >-
    Сейчас важнее всего ваша безопасность. Пожалуйста, позвоните на линию
    экстренной психологической помощи, а если есть угроза жизни — в службу 112.
    Если рядом есть близкий человек, скажите ему, что вам тяжело.

levels:
  L0: Можно попробовать практики самопомощи и понаблюдать за состоянием
  L1: Желательно рассмотреть консультацию специалиста
  L2: Рекомендуется обратиться к специалисту
  L3: Необходимо срочно обратиться за помощью
  insufficient_data: Недостаточно данных, чтобы оценить срочность

refuse: Не хочу отвечать

# Направления за помощью в порядке показа (Referral).
referrals:
  emergency_medical_care: Эти признаки могут требовать неотложной медицинской помощи. Вызовите скорую помощь.
  crisis_helpline: Если сейчас тяжело, позвоните на линию экстренной психологической помощи.
  doctor_visit: Такие жалобы бывают по разным причинам, поэтому стоит сначала обратиться к врачу.

questions:
  manifestations:
    text: >-
      Расскажите, пожалуйста, чуть подробнее, что вас беспокоит: что вы чувствуете,
      что замечаете в теле, в мыслях или в поведении?

  duration:
    text: Как давно это началось?
    options:
      less_than_week: Меньше недели
      about_week: Около недели
      two_three_weeks: Две-три недели
      about_month: Около месяца
      few_months: Несколько месяцев
      half_year_or_more: Полгода и дольше

  frequency:
    text: Как часто это бывает?
    options:
      rarely: Редко, время от времени
      several_times_a_week: Несколько раз в неделю
      most_days: Большую часть дней
      constantly: Почти всё время

  impact:
    text: >-
      Насколько это мешает жить: работать или учиться, общаться с близкими,
      справляться с делами?
    options:
      none: Почти не мешает
      mild: Немного мешает
      moderate: Заметно мешает
      # Вариант ведёт к правилу R06 и уровню L3, поэтому подпись описывает
      # именно тяжёлое нарушение функционирования.
      severe: "Очень сильно: не получается справляться с обычными делами"

  affected_domains:
    text: В каких сферах это сказывается? Можно выбрать несколько.
    options:
      work_and_study: Работа или учёба
      relationships: Отношения с близкими
      daily_life: Быт и забота о себе
      leisure_and_community: Отдых, увлечения, общение с людьми

  self_harm:
    text: >-
      Иногда, когда человеку очень тяжело, появляются мысли, что не хочется жить,
      или мысли причинить себе вред. Этот вопрос мы задаём всем.
      Бывало ли у вас такое в последнее время?
    follow_up: >-
      Вы упомянули тяжёлые мысли. Мне важно понять, как вы сейчас, поэтому спрошу
      ещё раз: бывают ли у вас мысли, что не хочется жить, или мысли причинить себе вред?
    options:
      none: Нет, такого не было
      passive: Бывают мысли, что лучше бы меня не было, но вредить себе я не собираюсь
      active: Бывают мысли причинить себе вред
      plan: Я думаю, как это сделать, или собираюсь

  sleep:
    text: Изменился ли за это время сон?
    options:
      unchanged: Нет, сплю как обычно
      decreased: Сплю меньше или хуже
      increased: Сплю больше обычного

  energy:
    text: А как с силами и энергией?
    options:
      unchanged: Как обычно
      decreased: Сил стало меньше
      increased: Энергии больше, чем обычно

  appetite:
    text: Изменился ли аппетит?
    options:
      unchanged: Нет, ем как обычно
      decreased: Ем меньше обычного
      increased: Ем больше обычного

  substance_use:
    text: Бывает ли, что вы употребляете алкоголь или другие вещества, чтобы стало легче?
    options:
      "no": Нет
      "yes": Да, бывает

  goal:
    text: Чего бы вам хотелось от встречи со специалистом? Можно ответить своими словами.
    options:
      refuse: Пока не знаю

# Объяснения сработавших правил (InferenceRule). Английский оригинал — в
# `hasDescription` индивида правила в онтологии.
rules:
  R01: Вы упомянули беспокойство, страх или избегание, поэтому могут помочь практики для работы с тревогой.
  R02: Вы упомянули сниженное настроение или связанные с ним изменения, поэтому могут помочь практики для настроения.
  R03: Вы упомянули трудности со сном, поэтому могут помочь практики для сна.
  R04: Вы упомянули признаки напряжения, поэтому могут помочь практики для управления стрессом.
  R05: То, что вы описали, может требовать срочной поддержки. Пожалуйста, обратитесь за помощью сейчас.
  R06: Это серьёзно влияет на вашу жизнь, поэтому важно получить помощь как можно скорее.
  R07: Вы упомянули мысли причинить себе вред. Пожалуйста, обратитесь за помощью сейчас.
  R08: Вы упомянули план причинить себе вред. Пожалуйста, обратитесь за помощью прямо сейчас.
  R09: Вы упомянули мысли о смерти, поэтому рекомендуется поговорить со специалистом.
  R10: Сниженное настроение длится не меньше двух недель и влияет на вашу жизнь, поэтому рекомендуется обратиться к специалисту.
  R11: Тревога длится не меньше двух недель и влияет на вашу жизнь, поэтому рекомендуется обратиться к специалисту.
  R12: Несколько видов трудностей держатся не меньше двух недель большую часть дней, поэтому рекомендуется обратиться к специалисту.
  R13: Эти практики часто советуют при том, что вы описали.
  R14: Это продолжается не меньше двух недель большую часть дней, поэтому стоит подумать о консультации.
  R15: Это влияет на вашу жизнь, поэтому стоит подумать о консультации.
  R16: Вы упомянули, что заново переживаете события или всё время настороже, поэтому могут помочь бережные практики, которые помогают почувствовать себя в безопасности.
  R17: Вы упомянули повторяющиеся мысли или действия; самую подходящую помощь здесь может предложить специалист.
  R18: Вы упомянули онемение чувств или отстранённость, поэтому могут помочь практики, которые возвращают внимание к настоящему.
  R19: Вы упомянули утрату, поэтому могут помочь бережная забота о себе и поддержка.
  R20: Вы упомянули трудности с другими людьми, поэтому могут помочь эти шаги.
  R21: Вы упомянули большие перемены в жизни, поэтому эти шаги могут помочь к ним приспособиться.
  R22: Вы упомянули практические проблемы, поэтому эти шаги могут помочь с ними справиться.
  R23: То, что вы описали, стоит обсудить со специалистом.
  R24: Ваша безопасность важна, и специалисты и службы поддержки могут помочь.
  R25: Эти реакции держатся уже какое-то время и влияют на вашу жизнь, поэтому рекомендуется обратиться к специалисту.
  R26: Эти повторяющиеся мысли или действия влияют на вашу жизнь, поэтому рекомендуется обратиться к специалисту.
  R27: Онемение чувств или отстранённость влияют на вашу жизнь, поэтому рекомендуется обратиться к специалисту.
  R28: У таких телесных симптомов может быть много причин, поэтому стоит сначала обратиться к врачу.
  R29: Эти признаки могут требовать неотложной медицинской помощи. Пожалуйста, вызовите скорую помощь сейчас.
  R30: Вы упомянули мысли о смерти или о том, чтобы причинить себе вред, поэтому рекомендуется поговорить со специалистом.
  R31: Вы упомянули трудности с тем, как вы себя воспринимаете или в чём видите смысл, поэтому могут помочь практики для отношения к себе.
  R32: Трудности с отношением к себе держатся уже какое-то время и влияют на вашу жизнь, поэтому рекомендуется обратиться к специалисту.
  R33: Вы упомянули трудности в общении с другими людьми, поэтому могут помочь эти шаги.
  R34: Вы упомянули, что скучаете по умершему человеку, поэтому могут помочь бережная забота о себе и поддержка.
